name: CD
on: 
  push:
    branches: [main]

jobs:
  deploy:
    name: Deploy
    runs-on: ubuntu-latest
    
    steps: 
      - name: Check out the Code 
        uses: actions/checkout@v6 

      - name: Setup Go 
        uses: actions/setup-go@v6 
        with: 
          go-version: "1.27.1"

      - name: Build app 
        run: ./scripts/buildprod.sh
